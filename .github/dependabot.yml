# Dependabot (spec section 11.6: "Dependabot is on").
# Weekly checks; PRs propose exact-version bumps so the lockfile stays pinned.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    versioning-strategy: strict
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
