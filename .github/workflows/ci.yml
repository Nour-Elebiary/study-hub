name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cp .env.example .env.local # placeholder values; env is only read at runtime, not build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  rls:
    name: RLS tests (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Start local Supabase and run RLS tests
        run: |
          supabase start
          npm run test:rls

  e2e:
    name: Playwright e2e (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Start local Supabase and write .env.local
        run: |
          supabase start
          supabase db reset
          # The seeded stack needs the real local keys, not the placeholders.
          supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=' | sed \
            -e 's/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/' \
            -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' > .env.local
          grep -v -E '^(NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY)=' \
            .env.example >> .env.local
      # The offline e2e test needs a production build: the service worker
      # registers only in production, so E2E_PROD switches Playwright's
      # webServer to `npm run start`.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_PROD: "1"
      - name: Lighthouse mobile performance (Home and Note >= 90)
        run: |
          # The student pages need the join cookie; CI mints one with the
          # same placeholder secret from .env.example (local/CI only).
          export $(grep '^JOIN_COOKIE_SECRET=' .env.local)
          COOKIE=$(node -e "const c=require('node:crypto');const b=Buffer.from(JSON.stringify({v:1,iat:Date.now(),scope:{all:true}})).toString('base64url');console.log(b+'.'+c.createHmac('sha256',process.env.JOIN_COOKIE_SECRET).update(b).digest('base64url'))")
          npm run start &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/s/join > /dev/null && break; sleep 1; done
          run_lh() {
            url="$1"; out="$2"
            for attempt in 1 2 3; do
              npx --yes lighthouse@12 "$url" --only-categories=performance \
                --output=json --output-path="$out" --quiet \
                --chrome-flags="--headless" \
                --extra-headers="{\"Cookie\":\"sh_student=$COOKIE\"}" || continue
              node scripts/check-lighthouse.mjs "$out" 90 && return 0
            done
            return 1
          }
          run_lh "http://127.0.0.1:3000/s" lh-home.json
          run_lh "http://127.0.0.1:3000/s/notes/eeeeeeee-0000-eeee-0000-000000000003" lh-note.json

      - name: Load test (20 concurrent users)
        run: |
          # The server started in the previous step is still running.
          export $(grep '^JOIN_COOKIE_SECRET=' .env.local)
          node scripts/load-test.mjs

  security:
    name: Secret scan + dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
